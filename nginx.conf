server {
    listen 80;
    server_name localhost;

    # Root directory for static files
    root /usr/share/nginx/html;
    index index.html;

    # Main page
    location = / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets
    location /static/ {
        alias /usr/share/nginx/html/static/;
    }
    
    # Specific catch for app.py to redirect to base routes
    location ~ ^/warrant/app\.py$ {
        return 301 $scheme://$host/warrant/;
    }
    
    location ~ ^/optlt/app\.py$ {
        return 301 $scheme://$host/optlt/;
    }

    # OPTLT Application
    location /optlt/ {
        # Try to access the app, if it's not available yet, show the loading page
        error_page 502 504 = @optlt_loading;
        
        proxy_pass http://optlt-web:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300;
        client_max_body_size 0;
    }
    
    # Loading page for OPTLT
    location @optlt_loading {
        root /usr/share/nginx/html;
        try_files /optlt/static/loading.html =502;
    }

    # Warrant Application
    location /warrant/ {
        # Try to access the app, if it's not available yet, show the loading page
        error_page 502 504 = @warrant_loading;
        
        proxy_pass http://warrant-app:8501/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Streamlit-specific settings
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300;
        client_max_body_size 0;
        
        # Remove the intercept that causes infinite redirects
    }
    
    # Loading page location
    location @warrant_loading {
        root /usr/share/nginx/html;
        try_files /warrant/static/loading.html =502;
    }
    
    # Specific route for Streamlit static files
    location /warrant/static {
        proxy_pass http://warrant-app:8501/static/;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_cache_bypass $http_upgrade;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # Error handling
    error_page 404 /404.html;
    location = /404.html {
        root /usr/share/nginx/html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}