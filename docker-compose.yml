version: '3.8'

services:
  # Nginx for reverse proxy and serving static files
  nginx:
    image: nginx:alpine
    container_name: financial-tools-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./index.html:/usr/share/nginx/html/index.html
      - ./warrant/static:/usr/share/nginx/html/warrant/static
      - ./optlt/static:/usr/share/nginx/html/optlt/static
    depends_on:
      - optlt-web
      - warrant-app
    restart: unless-stopped

  # OPTLT App (Long-term option pricing)
  optlt-web:
    build:
      context: ./optlt
      dockerfile: Dockerfile
    container_name: optlt-web
    expose:
      - "5000"
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=0
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - redis
    volumes:
      - ./optlt:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  # Redis for OPTLT app
  redis:
    image: redis:alpine
    container_name: financial-tools-redis
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # Celery worker for OPTLT app
  celery_worker:
    build:
      context: ./optlt
      dockerfile: Dockerfile
    container_name: optlt-celery-worker
    command: celery -A app.celery worker --loglevel=info
    volumes:
      - ./optlt:/app
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - optlt-web
      - redis
    restart: unless-stopped

  # Warrant Pricing App
  warrant-app:
    build:
      context: ./warrant
      dockerfile: Dockerfile
    container_name: warrant-app
    expose:
      - "8501"
    volumes:
      - ./warrant:/app
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - STREAMLIT_SERVER_MAX_UPLOAD_SIZE=10
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
      - STREAMLIT_SERVER_ENABLE_STATIC_SERVING=true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8501/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  redis_data: